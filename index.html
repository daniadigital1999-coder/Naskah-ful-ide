<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Kreator Gaming</title>
    <style>
        :root {
            --bg: #050a14;
            --panel: #0f172a;
            --neon-biru: #00d4ff;
            --neon-pink: #ff007f;
            --neon-hijau: #00ff9d;
            --teks: #f1f5f9;
        }

        body {
            background-color: var(--bg);
            color: var(--teks);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: var(--panel);
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--neon-biru);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        h2 { color: var(--neon-pink); text-transform: uppercase; text-align: center; font-size: 1.2rem; letter-spacing: 1px; }
        
        .label-seksi { font-size: 0.75rem; color: var(--neon-hijau); font-weight: bold; margin-top: 15px; display: block; text-transform: uppercase; }

        input, textarea {
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            box-sizing: border-box;
            margin-top: 5px;
            font-family: inherit;
        }

        input:focus, textarea:focus { border-color: var(--neon-biru); outline: none; box-shadow: 0 0 5px var(--neon-biru); }

        .grup-tombol { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        
        button {
            padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }

        .btn-simpan { background: var(--neon-hijau); color: #050a14; grid-column: span 2; }
        .btn-unduh { background: #334155; color: white; }
        .btn-hapus { background: #691414; color: white; }

        /* Style Daftar Tugas */
        .tugas-item { background: #16213e; padding: 10px; border-radius: 5px; margin-top: 5px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--neon-biru); cursor: pointer; }
        .selesai { opacity: 0.5; text-decoration: line-through; border-left-color: var(--neon-pink); }
    </style>
</head>
<body>

<!-- BAGIAN 1: TUGAS HARIAN (CHECKLIST) -->
<div class="container">
    <h2>⚔️ Tugas Harian (Quest)</h2>
    <div style="display: flex; gap: 5px;">
        <input type="text" id="inputTugas" placeholder="Tambah tugas baru hari ini...">
        <button onclick="tambahTugas()" style="background: var(--neon-biru); color: #000;">TAMBAH</button>
    </div>
    <div id="daftarTugas" style="margin-top: 10px;"></div>
</div>

<!-- BAGIAN 2: TEMPLATE NASKAH KONTEN -->
<div class="container">
    <h2>📝 Editor Naskah Konten</h2>
    <p id="tampilanTanggal" style="text-align: center; font-size: 0.8rem; color: var(--neon-biru); font-weight: bold;"></p>

    <span class="label-seksi">Judul Konten</span>
    <input type="text" id="judul" placeholder="Contoh: Cara Fast Hand Gusion">

    <span class="label-seksi">1. Hook (3 Detik Pertama - Penarik Perhatian)</span>
    <textarea id="hook" rows="2" placeholder="Tulis kalimat pembuka yang bikin orang berhenti scroll..."></textarea>

    <span class="label-seksi">2. Masalah (Problem)</span>
    <textarea id="masalah" rows="2" placeholder="Apa kesulitan yang dialami penonton? (Contoh: Sering kalah mekanik?)"></textarea>

    <span class="label-seksi">3. Isi / Tutorial (Value)</span>
    <textarea id="isi" rows="6" placeholder="Tulis langkah-langkah detail atau inti kontenmu di sini..."></textarea>

    <span class="label-seksi">4. Call To Action (Penutup/Ajakan)</span>
    <input type="text" id="cta" placeholder="Contoh: Follow untuk tips Mythic lainnya!">

    <div class="grup-tombol">
        <button class="btn-simpan" onclick="simpanKeDrive()">KIRIM KE GOOGLE DRIVE</button>
        <button class="btn-unduh" onclick="unduhTxt()">UNDUH FILE .TXT</button>
        <button class="btn-hapus" onclick="hapusSemua()">RESET FORM</button>
    </div>
    <p style="font-size: 0.7rem; text-align: center; margin-top: 10px; color: #64748b;">*Naskah otomatis tersimpan sebagai draf di browser ini.</p>
</div>

<script>
    // Set Tanggal Otomatis (Bahasa Indonesia)
    const sekarang = new Date();
    document.getElementById('tampilanTanggal').innerText = sekarang.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    // Muat Data Otomatis saat halaman dibuka
    window.onload = () => {
        const dataTersimpan = JSON.parse(localStorage.getItem('dataNaskah') || '{}');
        if(dataTersimpan) {
            document.getElementById('judul').value = dataTersimpan.judul || '';
            document.getElementById('hook').value = dataTersimpan.hook || '';
            document.getElementById('masalah').value = dataTersimpan.masalah || '';
            document.getElementById('isi').value = dataTersimpan.isi || '';
            document.getElementById('cta').value = dataTersimpan.cta || '';
        }
        tampilkanTugas();
    };

    // Simpan otomatis ke browser tiap kali ada perubahan ketikan
    document.addEventListener('input', () => {
        const data = {
            judul: document.getElementById('judul').value,
            hook: document.getElementById('hook').value,
            masalah: document.getElementById('masalah').value,
            isi: document.getElementById('isi').value,
            cta: document.getElementById('cta').value
        };
        localStorage.setItem('dataNaskah', JSON.stringify(data));
    });

    // --- FUNGSI DAFTAR TUGAS ---
    function tambahTugas() {
        const input = document.getElementById('inputTugas');
        if(!input.value) return;
        let daftar = JSON.parse(localStorage.getItem('tugasHarian') || '[]');
        daftar.push({ teks: input.value, selesai: false });
        localStorage.setItem('tugasHarian', JSON.stringify(daftar));
        input.value = '';
        tampilkanTugas();
    }

    function tampilkanTugas() {
        const wadah = document.getElementById('daftarTugas');
        const daftar = JSON.parse(localStorage.getItem('tugasHarian') || '[]');
        wadah.innerHTML = daftar.map((t, i) => `
            <div class="tugas-item ${t.selesai ? 'selesai' : ''}">
                <span onclick="toggleTugas(${i})">${t.teks}</span>
                <button onclick="hapusTugas(${i})" style="background:transparent; color:red; border:none; font-weight:bold;">✖</button>
            </div>
        `).join('');
    }

    function toggleTugas(i) {
        let daftar = JSON.parse(localStorage.getItem('tugasHarian'));
        daftar[i].selesai = !daftar[i].selesai;
        localStorage.setItem('tugasHarian', JSON.stringify(daftar));
        tampilkanTugas();
    }

    function hapusTugas(i) {
        let daftar = JSON.parse(localStorage.getItem('tugasHarian'));
        daftar.splice(i, 1);
        localStorage.setItem('tugasHarian', JSON.stringify(daftar));
        tampilkanTugas();
    }

    // --- FUNGSI SIMPAN & SHARE ---
    const urlGas = "MASUKKAN_URL_GOOGLE_APPS_SCRIPT_ANDA"; // Masukkan URL dari Google Apps Script

    function simpanKeDrive() {
        const data = JSON.parse(localStorage.getItem('dataNaskah'));
        if(!data.judul) return alert("Isi judul naskah dulu!");
        
        const btn = document.querySelector('.btn-simpan');
        btn.innerText = "MENGIRIM...";

        fetch(urlGas, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({
                goal: "NASKAH: " + data.judul,
                tasks: `HOOK: ${data.hook} | MASALAH: ${data.masalah} | ISI: ${data.isi}`,
                notes: `CTA: ${data.cta}`
            })
        }).then(() => {
            alert("Naskah Berhasil Terkirim ke Google Drive!");
            btn.innerText = "KIRIM KE GOOGLE DRIVE";
        });
    }

    function unduhTxt() {
        const data = JSON.parse(localStorage.getItem('dataNaskah'));
        const teksFile = `JUDUL: ${data.judul}\n\n[HOOK]\n${data.hook}\n\n[MASALAH]\n${data.masalah}\n\n[ISI]\n${data.isi}\n\n[CTA]\n${data.cta}`;
        const blob = new Blob([teksFile], {type: 'text/plain'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Naskah_${data.judul || 'TanpaJudul'}.txt`;
        link.click();
    }

    function hapusSemua() {
        if(confirm("Hapus semua isi naskah? Tindakan ini tidak bisa dibatalkan.")) {
            localStorage.removeItem('dataNaskah');
            location.reload();
        }
    }
</script>

</body>
</html>
