<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Hub Campuran</title>
    <style>
        :root {
            --bg: #030712;
            --panel: #111827;
            --aksen: #8b5cf6; /* Ungu Gaming */
            --neon-hijau: #10b981;
            --neon-biru: #3b82f6;
            --teks: #f9fafb;
        }

        body {
            background-color: var(--bg);
            color: var(--teks);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: var(--panel);
            width: 100%;
            max-width: 550px;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #374151;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        h2 { color: var(--aksen); text-align: center; margin-top: 0; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 2px; }
        
        .label-seksi { font-size: 0.75rem; color: #9ca3af; font-weight: 600; margin-top: 15px; display: block; text-transform: uppercase; letter-spacing: 1px; }

        input, textarea, select {
            background: #1f2937;
            border: 1px solid #4b5563;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 6px;
            font-size: 0.95rem;
        }

        input:focus, textarea:focus, select:focus { border-color: var(--aksen); outline: none; }

        .grup-tombol { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
        
        button {
            padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase;
        }

        .btn-simpan { background: var(--aksen); color: white; grid-column: span 2; box-shadow: 0 0 10px rgba(139, 92, 246, 0.4); }
        .btn-unduh { background: #374151; color: white; }
        .btn-hapus { background: #7f1d1d; color: white; }

        /* Quest List */
        .tugas-item { background: #1f2937; padding: 12px; border-radius: 8px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--neon-biru); transition: 0.3s; }
        .selesai { opacity: 0.4; border-left-color: var(--neon-hijau); background: #111827; }
        .tugas-teks { flex: 1; cursor: pointer; margin-right: 10px; }
    </style>
</head>
<body>

<!-- BAGIAN 1: QUEST HARIAN -->
<div class="container">
    <h2>⚔️ Daily Quests</h2>
    <div style="display: flex; gap: 8px;">
        <input type="text" id="inputTugas" placeholder="Rencana hari ini (misal: Edit video 1)...">
        <button onclick="tambahTugas()" style="background: var(--neon-biru); color: white; padding: 0 20px;">+</button>
    </div>
    <div id="daftarTugas" style="margin-top: 10px;"></div>
</div>

<!-- BAGIAN 2: EDITOR KONTEN CAMPURAN -->
<div class="container">
    <h2>🎬 Multi-Content Editor</h2>
    <p id="tampilanTanggal" style="text-align: center; font-size: 0.85rem; color: #6b7280; margin-bottom: 20px;"></p>

    <span class="label-seksi">Jenis Konten</span>
    <select id="jenisKonten" onchange="updatePlaceholder()">
        <option value="Tutorial">Tutorial (Tips & Trik)</option>
        <option value="Review">Review (Item/Hero/Skin)</option>
        <option value="Story">Storytelling / Curhat Gaming</option>
        <option value="Streaming">Naskah Live Stream</option>
    </select>

    <span class="label-seksi">Judul Naskah</span>
    <input type="text" id="judul" placeholder="Masukkan judul menarik...">

    <span class="label-seksi">Bagian 1: Pembuka (Hook)</span>
    <textarea id="hook" rows="2" placeholder="Kalimat penarik perhatian..."></textarea>

    <span class="label-seksi">Bagian 2: Inti Konten (Isi)</span>
    <textarea id="isi" rows="6" placeholder="Tulis pembahasan utama di sini..."></textarea>

    <span class="label-seksi">Bagian 3: Penutup (CTA)</span>
    <input type="text" id="cta" placeholder="Contoh: Komen mau konten apa lagi?">

    <div class="grup-tombol">
        <button class="btn-simpan" onclick="simpanKeDrive()">Kirim ke Google Drive</button>
        <button class="btn-unduh" onclick="unduhTxt()">Unduh .TXT</button>
        <button class="btn-hapus" onclick="hapusSemua()">Reset Semua</button>
    </div>
</div>

<script>
    const sekarang = new Date();
    document.getElementById('tampilanTanggal').innerText = sekarang.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    window.onload = () => {
        const data = JSON.parse(localStorage.getItem('dataCampuran') || '{}');
        if(data) {
            document.getElementById('jenisKonten').value = data.jenis || 'Tutorial';
            document.getElementById('judul').value = data.judul || '';
            document.getElementById('hook').value = data.hook || '';
            document.getElementById('isi').value = data.isi || '';
            document.getElementById('cta').value = data.cta || '';
        }
        tampilkanTugas();
    };

    document.addEventListener('input', () => {
        const data = {
            jenis: document.getElementById('jenisKonten').value,
            judul: document.getElementById('judul').value,
            hook: document.getElementById('hook').value,
            isi: document.getElementById('isi').value,
            cta: document.getElementById('cta').value
        };
        localStorage.setItem('dataCampuran', JSON.stringify(data));
    });

    function updatePlaceholder() {
        const jenis = document.getElementById('jenisKonten').value;
        const isi = document.getElementById('isi');
        if(jenis === 'Review') isi.placeholder = "Tulis kelebihan, kekurangan, dan rating item/skin...";
        else if(jenis === 'Story') isi.placeholder = "Ceritakan pengalaman seru atau momen kocak saat main...";
        else if(jenis === 'Streaming') isi.placeholder = "Tulis poin obrolan saat live atau tantangan mabar...";
        else isi.placeholder = "Tulis langkah-langkah tutorial detail di sini...";
    }

    // --- LOGIKA TUGAS ---
    function tambahTugas() {
        const input = document.getElementById('inputTugas');
        if(!input.value) return;
        let daftar = JSON.parse(localStorage.getItem('tugasHarian') || '[]');
        daftar.unshift({ teks: input.value, selesai: false });
        localStorage.setItem('tugasHarian', JSON.stringify(daftar));
        input.value = '';
        tampilkanTugas();
    }

    function tampilkanTugas() {
        const wadah = document.getElementById('daftarTugas');
        const daftar = JSON.parse(localStorage.getItem('tugasHarian') || '[]');
        wadah.innerHTML = daftar.map((t, i) => `
            <div class="tugas-item ${t.selesai ? 'selesai' : ''}">
                <span class="tugas-teks" onclick="toggleTugas(${i})">${t.teks}</span>
                <button onclick="hapusTugas(${i})" style="background:transparent; color:#ef4444; border:none; font-size:1.2rem;">×</button>
            </div>
        `).join('');
    }

    function toggleTugas(i) {
        let daftar = JSON.parse(localStorage.getItem('tugasHarian'));
        daftar[i].selesai = !daftar[i].selesai;
        localStorage.setItem('tugasHarian', JSON.stringify(daftar));
        tampilkanTugas();
    }

    function hapusTugas(i) {
        let daftar = JSON.parse(localStorage.getItem('tugasHarian'));
        daftar.splice(i, 1);
        localStorage.setItem('tugasHarian', JSON.stringify(daftar));
        tampilkanTugas();
    }

    // --- SIMPAN KE DRIVE ---
    function simpanKeDrive() {
        const data = JSON.parse(localStorage.getItem('dataCampuran'));
        const urlGas = "MASUKKAN_URL_GOOGLE_APPS_SCRIPT_ANDA"; // Masukkan URL Apps Script
        
        if(!data.judul) return alert("Berikan judul dulu!");
        const btn = document.querySelector('.btn-simpan');
        btn.innerText = "SEDANG MENGIRIM...";

        fetch(urlGas, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({
                goal: `[${data.jenis}] ${data.judul}`,
                tasks: `PEMBUKA: ${data.hook} | ISI: ${data.isi}`,
                notes: `PENUTUP: ${data.cta}`
            })
        }).then(() => {
            alert("Naskah [" + data.jenis + "] Berhasil Terkirim!");
            btn.innerText = "KIRIM KE GOOGLE DRIVE";
        });
    }

    function unduhTxt() {
        const data = JSON.parse(localStorage.getItem('dataCampuran'));
        const teksFile = `JENIS KONTEN: ${data.jenis}\nJUDUL: ${data.judul}\n\n[PEMBUKA]\n${data.hook}\n\n[ISI]\n${data.isi}\n\n[PENUTUP]\n${data.cta}`;
        const blob = new Blob([teksFile], {type: 'text/plain'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Konten_${data.judul || 'Baru'}.txt`;
        link.click();
    }

    function hapusSemua() {
        if(confirm("Reset semua isian?")) {
            localStorage.removeItem('dataCampuran');
            location.reload();
        }
    }
</script>
</body>
</html>
